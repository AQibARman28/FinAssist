# Render Blueprint for the FinAssist backend (free tier, Docker).
# In Render: New → Blueprint → connect this repo. Render reads this file,
# creates the service, and you fill the `sync: false` secrets in the dashboard.
#
# Render injects PORT automatically; the app listens on process.env.PORT.
# Frontend lives on Vercel (see DEPLOY.md) — not in this blueprint. Set the
# same PROXY_SHARED_SECRET there.
services:
  - type: web
    name: finassist-api
    runtime: docker
    dockerfilePath: ./Backend/Dockerfile
    dockerContext: ./Backend
    plan: free
    region: oregon
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: ACCESS_TOKEN_TTL
        value: 15m
      # Vercel -> Render load balancer -> app.
      - key: TRUST_PROXY
        value: "2"
      # Off until a mail provider is configured: sign-up works without an
      # emailed code. To turn it on, set RESEND_API_KEY (or SMTP_HOST) and change
      # this to "true" — the API refuses to start with it on and no provider.
      - key: REQUIRE_EMAIL_VERIFICATION
        value: "false"
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_FROM
        value: FinAssist <no-reply@finassist.app>
      # ── Secrets — set these in the Render dashboard (never commit them) ──
      - key: MONGO_URI            # mongodb+srv://...  (% in password → %25)
        sync: false
      - key: JWT_SECRET           # 64 hex chars
        sync: false
      - key: MASTER_ENCRYPTION_KEY # 64 hex chars — BACK THIS UP; losing it loses all encrypted PII
        sync: false
      - key: EMAIL_HASH_SECRET    # 64 hex chars
        sync: false
      - key: PROXY_SHARED_SECRET  # 64 hex chars — same value as on Vercel
        sync: false
      - key: FRONTEND_URL         # your Vercel URL, e.g. https://finassist.vercel.app
        sync: false
      - key: RESEND_API_KEY       # Resend's HTTPS API (SMTP ports are blocked on the free tier)
        sync: false
      - key: SMTP_HOST            # alternative to Resend
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
