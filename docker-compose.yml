version: "3.9"

services:
  backend:
    build: ./Backend
    container_name: finassist-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: ${MONGO_URI}
      JWT_SECRET: ${JWT_SECRET}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      # Required — the backend refuses to start without these (64 hex chars each).
      MASTER_ENCRYPTION_KEY: ${MASTER_ENCRYPTION_KEY}
      EMAIL_HASH_SECRET: ${EMAIL_HASH_SECRET}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      # Optional outbound SMTP (unset → verification emails log to the console).
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-FinAssist <no-reply@finassist.local>}
    depends_on:
      - mongo

  frontend:
    build:
      context: ./views
      args:
        # Baked into the Next.js rewrite at build time so /api proxies to the
        # backend service (same-origin in the browser → SameSite cookies work).
        BACKEND_ORIGIN: http://backend:5000
    container_name: finassist-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

  mongo:
    image: mongo:8
    container_name: finassist-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: finassist

volumes:
  mongo_data:
